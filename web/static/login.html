<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>지갑 연결 — 402 Guard</title>
<!-- 이 자리에는 이메일·비밀번호 로그인/회원가입 자리표시 폼이 있었다.
     전송은 하지 않았지만(preventDefault) 화면에는 비밀번호 입력칸과 '회원가입' 탭이 떴다.
     "비밀번호를 만들지 않습니다"를 셀링 포인트로 내건 self-custody 제품이 살아 있는
     비밀번호 폼을 같은 도메인에서 서빙하는 것은 서사가 스스로를 반박하는 것이다.
     `/login` 라우트는 이미 서버가 connect.html 로 보내지만(web/server.py), StaticFiles
     때문에 `/static/login.html` 은 이 파일을 그대로 열었다 — 그래서 파일 자체를 리다이렉트로 바꾼다.
     파일을 지우지 않는 이유: 외부에 남아 있을 수 있는 링크가 404 가 되지 않게 한다. -->
<link rel="canonical" href="/connect">
<meta http-equiv="refresh" content="0; url=/connect">
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/skeleton.css">
</head>
<body>
<main class="auth">
  <section class="card auth-card">
    <div class="brand auth-brand">
      <h1>402 Guard</h1>
      <p class="tagline">지갑을 연결하면 로그인됩니다 — 비밀번호는 만들지 않습니다</p>
    </div>
    <p class="auth-notice">
      로그인 페이지가 <a href="/connect">지갑 연결</a>로 통합되었습니다. 자동으로 이동합니다.
    </p>
  </section>
</main>
<script>location.replace("/connect");</script>
</body>
</html>
